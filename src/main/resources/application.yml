# FinFlow 설정 (비밀값은 환경변수/.env에서 주입)

spring:
  application:
    name: finflow-engine

  # 로컬 실행 시 저장소 루트의 .env를 설정으로 불러옴 (없으면 무시)
  config:
    import:
      - optional:file:.env[.properties]

  datasource:
    # Docker 안에서는 DB_URL로 덮어씀, DB 시간 기준 UTC. 비밀번호는 기본값 없음
    url: ${DB_URL:jdbc:mysql://localhost:3311/finflow?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${MYSQL_USER:ffuser}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 커넥션을 얻을 때까지 최대 10초 대기
    hikari:
      connection-timeout: 10000

  # Flyway: 공통 마이그레이션 + DB별 마이그레이션(Spring Batch 메타 테이블)
  flyway:
    locations: classpath:db/migration,classpath:db/vendor/{vendor}

  batch:
    job:
      # 서버 시작 때 배치를 자동 실행하지 않음 (스케줄러·운영자 API가 실행)
      enabled: false
    jdbc:
      # 메타 테이블은 Flyway(V3)가 만듦
      initialize-schema: never

  jackson:
    deserialization:
      # 정수 칸(금액·기간·자녀 수)에 소수가 오면 버리지 않고 거부 (#5: 1.5를 1로 접수하던 문제)
      accept-float-as-int: false

  jpa:
    # 요청 끝까지 DB 커넥션을 잡지 않도록 OSIV 끔 (HomeFin #71에서 확인한 문제)
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)가 만들고 바꿈, Hibernate는 엔티티와 테이블이 맞는지 확인만
      ddl-auto: validate
    show-sql: false

server:
  # FinFlow 포트 8110 (HomeFin 8100, RiskWatch 8120)
  port: ${SERVER_PORT:8110}

app:
  # HomeFin 서버의 서비스 토큰 서명 키 (HomeFin과 FinFlow만 앎, 32바이트 이상, 기본값 없음)
  service-token:
    secret: ${SERVICE_TOKEN_SECRET}
  operator:
    # 운영자 토큰 서명 키 (FinFlow만 앎, 32바이트 이상, 기본값 없음)
    jwt-secret: ${OPERATOR_JWT_SECRET}
    # 운영자 토큰 유효 기간 (기본 8시간)
    token-expiration-ms: ${OPERATOR_TOKEN_EXPIRATION_MS:28800000}
    # 첫 운영자 계정 (서버 시작 때 없으면 만듦, 비우면 만들지 않음)
    initial-email: ${OPERATOR_EMAIL:}
    initial-password: ${OPERATOR_PASSWORD:}
  batch:
    # 접수 후 이 기간이 지나도록 심사를 시작하지 않은 신청은 만료 (일, 기본 30)
    expire-days: ${APPLICATION_EXPIRE_DAYS:30}
    # 자동 실행 (만료 매일 03:00, 집계 03:30, 한국 시각). 테스트는 끔
    scheduling-enabled: ${BATCH_SCHEDULING_ENABLED:true}
    # 만료 배치 한 번에 처리하는 건수 (chunk)
    chunk-size: ${BATCH_CHUNK_SIZE:100}
  riskwatch:
    # 심사 시작 때 판정을 받는 RiskWatch 주소 (Docker 안에서는 서비스 이름으로 덮어씀)
    base-url: ${RISKWATCH_BASE_URL:http://localhost:8120}
    # RiskWatch에 보내는 서비스 토큰 키 (RiskWatch의 FINFLOW_TOKEN_SECRET과 같은 값, FinFlow의 다른 키와 다르게, 기본값 없음)
    token-secret: ${RISKWATCH_TOKEN_SECRET}
    # 연결 2초, 응답 3초, 연결 실패·5xx는 0.2초 뒤 한 번 더
    connect-timeout-ms: ${RISKWATCH_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${RISKWATCH_READ_TIMEOUT_MS:3000}
    retry-backoff-ms: ${RISKWATCH_RETRY_BACKOFF_MS:200}
  encryption:
    # 연소득·DTI 암호화 키 (정확히 32바이트, 기본값 없음)
    key: ${ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        # 웹으로는 health만 공개 (env, beans 등 내부 정보 노출 방지)
        include: health
  endpoint:
    health:
      # 상태 세부 정보 숨김
      show-details: never

logging:
  level:
    com.finflow: INFO
  pattern:
    # 로그 형식: 시간 [스레드] [traceId] 레벨 클래스 - 메시지
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{traceId}] %-5level %logger{36} - %msg%n"
