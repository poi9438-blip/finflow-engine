# 테스트 설정: MySQL 대신 H2 메모리 DB 사용

spring:
  # @DataJpaTest도 아래 H2(MySQL 모드) 설정을 그대로 사용
  test:
    database:
      replace: none
  datasource:
    # 테스트 컨텍스트마다 새 DB, MySQL 문법으로 Flyway SQL 실행
    url: jdbc:h2:mem:fftest-${random.uuid};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      # 운영과 같이 Flyway가 테이블을 만듦
      ddl-auto: none

# 테스트 전용 비밀값 (실제 값 아님)
app:
  service-token:
    secret: FinFlow-Test-Service-Token-Secret-32bytes-or-more
  operator:
    jwt-secret: FinFlow-Test-Operator-JWT-Secret-32bytes-or-more
    token-expiration-ms: 3600000
    initial-email: operator@test.local
    initial-password: Operator-Test-Pass!1
  encryption:
    key: FinFlow-AES-256-Key-Test-Padded!
  batch:
    expire-days: 30
    # 테스트는 자동 실행 끔 (테스트가 직접 실행)
    scheduling-enabled: false
    # 작게 잡아서 여러 chunk에 걸친 처리도 확인
    chunk-size: 2
